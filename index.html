<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login">
    <h2>Welcome Back</h2>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" placeholder="john@example.com" id="email">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" placeholder="•••••" id="password">
    </div>

    <button>Sign In</button>

    <div class="bottom">
      <p>Or Continue With</p>

      <div class="socials">
        <div>
          <img width="20" src="./facebook (1).svg" alt="Facebook">
        </div>
        <div>
          <img width="20" src="./twitter.svg" alt="Twitter">
        </div>
        <div>
          <img width="20" src="./google (1).svg" alt="Google">
        </div>
      </div>

    </div>
  </div>
</body>
</html>
